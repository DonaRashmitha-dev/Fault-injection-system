<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fault Injection Dashboard</title>
<style>
  :root {
    --bg: #0a0a0f; --panel: #12121a; --border: #1e1e2e;
    --text: #cdd6f4; --sub: #6c7086; --red: #f38ba8;
    --yellow: #f9e2af; --green: #a6e3a1; --blue: #89b4fa;
    --purple: #cba6f7; --cyan: #89dceb; --orange: #fab387;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; padding: 20px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: var(--blue); }
  .sub { color: var(--sub); font-size: 0.8rem; margin-bottom: 20px; }

  /* Auth bar */
  .auth-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .auth-bar input { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; flex: 1; max-width: 320px; }
  .auth-bar label { color: var(--sub); font-size: 0.8rem; }
  .auth-status { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; }
  .auth-status.ok  { background: #1a2e1a; color: var(--green); }
  .auth-status.bad { background: #2e1a1a; color: var(--red); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .card-label { font-size: 0.7rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; }
  .card-val { font-size: 1.8rem; font-weight: bold; margin-top: 4px; }
  .card-val.red { color: var(--red); } .card-val.green { color: var(--green); }
  .card-val.blue { color: var(--blue); } .card-val.yellow { color: var(--yellow); }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .section-title { font-size: 0.75rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  .fault-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .fault-btn { background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 0.85rem; transition: all .15s; }
  .fault-btn:hover { border-color: var(--blue); color: var(--blue); background: #0a1a2e; }
  .fault-btn.crash:hover   { border-color: var(--red);    color: var(--red);    background: #2e0a0a; }
  .fault-btn.memory:hover  { border-color: var(--purple); color: var(--purple); background: #1a0a2e; }
  .fault-btn.cpu_spike:hover     { border-color: var(--orange); color: var(--orange); background: #2e1a0a; }
  .fault-btn.network_block:hover { border-color: var(--blue);   color: var(--blue);   background: #0a0a2e; }
  .fault-btn.disk_flood:hover    { border-color: var(--cyan);   color: var(--cyan);   background: #001a1a; }
  .fault-btn.random:hover  { border-color: var(--yellow); color: var(--yellow); background: #2e2a0a; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  canvas { width: 100%; height: 80px; display: block; }

  .sched { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=number] { background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; }
  .btn { padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .btn.green { background: var(--green); color: #000; }
  .btn.red   { background: var(--red);   color: #000; }
  .sched-status { font-size: 0.8rem; color: var(--sub); }

  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { color: var(--sub); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 400; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
  td { padding: 6px 8px; border-bottom: 1px solid #0e0e18; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; }
  .badge.crash         { background: #2e0a0a; color: var(--red); }
  .badge.memory        { background: #1a0a2e; color: var(--purple); }
  .badge.delay         { background: #2e2a0a; color: var(--yellow); }
  .badge.cpu_spike     { background: #2e1a0a; color: var(--orange); }
  .badge.network_block { background: #0a0a2e; color: var(--blue); }
  .badge.disk_flood    { background: #001a1a; color: var(--cyan); }
  .badge.random        { background: #1a1a0a; color: var(--yellow); }
  .badge.ok   { background: #0a2e0a; color: var(--green); }
  .badge.err  { background: #2e0a0a; color: var(--red); }

  .hist-controls { display: flex; gap: 8px; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px;
    font-size: 0.82rem; display: none; z-index: 99; }
  .toast.show { display: block; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .process-pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; margin-left: 10px; }
  .process-pill.alive { background: #0a2e0a; color: var(--green); }
  .process-pill.dead  { background: #2e0a0a; color: var(--red); }
</style>
</head>
<body>

<h1>⚡ Fault Injection System <span id="process-pill" class="process-pill alive">● ALIVE</span></h1>
<div class="sub">Chaos engineering dashboard — inject faults, measure recovery</div>

<!-- Auth -->
<div class="auth-bar">
  <label>API Token:</label>
  <input type="password" id="api-token" placeholder="Enter API token from .env" oninput="saveToken()"/>
  <span id="auth-status" class="auth-status bad">Not set</span>
</div>

<!-- Metrics -->
<div class="grid">
  <div class="card"><div class="card-label">Total Faults</div><div class="card-val blue" id="m-faults">0</div></div>
  <div class="card"><div class="card-label">Crashes</div><div class="card-val red" id="m-crashes">0</div></div>
  <div class="card"><div class="card-label">Recoveries</div><div class="card-val green" id="m-recoveries">0</div></div>
  <div class="card"><div class="card-label">Last MTTR</div><div class="card-val yellow" id="m-mttr">—</div></div>
  <div class="card"><div class="card-label">Avg MTTR</div><div class="card-val yellow" id="m-avg-mttr">—</div></div>
  <div class="card"><div class="card-label">Min MTTR</div><div class="card-val green" id="m-min-mttr">—</div></div>
</div>

<!-- Charts -->
<div class="charts">
  <div class="section">
    <div class="section-title">CPU %</div>
    <canvas id="cpu-chart"></canvas>
  </div>
  <div class="section">
    <div class="section-title">Memory %</div>
    <canvas id="mem-chart"></canvas>
  </div>
</div>

<!-- Fault Buttons -->
<div class="section">
  <div class="section-title">Inject Fault</div>
  <div class="fault-grid">
    <button class="fault-btn crash"         onclick="inject('crash')">💥 Crash</button>
    <button class="fault-btn delay"         onclick="inject('delay')">⏱ Delay</button>
    <button class="fault-btn memory"        onclick="inject('memory')">🧠 Memory</button>
    <button class="fault-btn cpu_spike"     onclick="inject('cpu_spike')">🔥 CPU Spike</button>
    <button class="fault-btn network_block" onclick="inject('network_block')">🌐 Network Block</button>
    <button class="fault-btn disk_flood"    onclick="inject('disk_flood')">💾 Disk Flood</button>
    <button class="fault-btn random"        onclick="inject('random')">🎲 Random</button>
  </div>
</div>

<!-- Scheduler -->
<div class="section">
  <div class="section-title">Scheduler</div>
  <div class="sched">
    <select id="sched-fault">
      <option value="random">random</option>
      <option value="crash">crash</option>
      <option value="delay">delay</option>
      <option value="memory">memory</option>
      <option value="cpu_spike">cpu_spike</option>
      <option value="network_block">network_block</option>
      <option value="disk_flood">disk_flood</option>
    </select>
    <input type="number" id="sched-interval" value="30" min="5" style="width:80px"/> seconds
    <button class="btn green" onclick="schedStart()">▶ Start</button>
    <button class="btn red"   onclick="schedStop()">■ Stop</button>
    <span class="sched-status" id="sched-status">Scheduler off</span>
  </div>
</div>

<!-- History -->
<div class="section">
  <div class="section-title">Event History</div>
  <div class="hist-controls">
    <button class="btn" style="background:var(--blue);color:#000" onclick="exportCSV()">↓ Export CSV</button>
    <button class="btn" style="background:var(--border);color:var(--text)" onclick="clearHistory()">✕ Clear</button>
  </div>
  <table>
    <thead><tr><th>Timestamp</th><th>Fault Type</th><th>Outcome</th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
const CPU_DATA = [], MEM_DATA = [], MAX_PTS = 60;

function getToken() { return document.getElementById('api-token').value.trim(); }
function saveToken() {
  const t = getToken();
  const el = document.getElementById('auth-status');
  if (t) { el.textContent = 'Set ✓'; el.className = 'auth-status ok'; }
  else    { el.textContent = 'Not set'; el.className = 'auth-status bad'; }
}

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => el.className = 'toast', 2500);
}

async function inject(fault) {
  const token = getToken();
  if (!token) { toast('Set API token first', true); return; }
  const r = await fetch('/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Token': token },
    body: JSON.stringify({ fault })
  });
  const d = await r.json();
  if (r.ok) toast(`✓ Injected: ${fault}`);
  else toast(d.error || 'Error', true);
}

async function schedStart() {
  const token = getToken();
  if (!token) { toast('Set API token first', true); return; }
  const fault    = document.getElementById('sched-fault').value;
  const interval = parseInt(document.getElementById('sched-interval').value);
  const r = await fetch('/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Token': token },
    body: JSON.stringify({ action: 'start', fault, interval })
  });
  const d = await r.json();
  if (r.ok) toast(`Scheduler started — ${fault} every ${interval}s`);
  else toast(d.error || 'Error', true);
}

async function schedStop() {
  const token = getToken();
  if (!token) { toast('Set API token first', true); return; }
  await fetch('/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Token': token },
    body: JSON.stringify({ action: 'stop' })
  });
  toast('Scheduler stopped');
}

async function clearHistory() {
  const token = getToken();
  if (!token) { toast('Set API token first', true); return; }
  await fetch('/clear-history', { method: 'POST', headers: { 'X-API-Token': token } });
  document.getElementById('history-body').innerHTML = '';
  toast('History cleared');
}

function exportCSV() { window.location.href = '/export'; }

function drawSparkline(canvasId, data, color) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  c.width = c.offsetWidth || 400; c.height = 80;
  ctx.clearRect(0, 0, c.width, c.height);
  if (data.length < 2) return;
  const max = 100, w = c.width, h = c.height;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (MAX_PTS - 1)) * w;
    const y = h - (v / max) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  // fill
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = color + '22'; ctx.fill();
}

async function poll() {
  try {
    const [mRes, sRes, hRes, schRes] = await Promise.all([
      fetch('/metrics'), fetch('/status'), fetch('/history'), fetch('/schedule/status')
    ]);
    const m = await mRes.json(), s = await sRes.json(),
          h = await hRes.json(), sch = await schRes.json();

    document.getElementById('m-faults').textContent    = m.total_faults ?? 0;
    document.getElementById('m-crashes').textContent   = m.crashes ?? 0;
    document.getElementById('m-recoveries').textContent= m.recoveries ?? 0;
    document.getElementById('m-mttr').textContent      = m.last_mttr != null ? m.last_mttr + 's' : '—';
    document.getElementById('m-avg-mttr').textContent  = m.avg_mttr  != null ? m.avg_mttr  + 's' : '—';
    document.getElementById('m-min-mttr').textContent  = m.min_mttr  != null ? m.min_mttr  + 's' : '—';

    CPU_DATA.push(m.cpu ?? 0); MEM_DATA.push(m.memory ?? 0);
    if (CPU_DATA.length > MAX_PTS) CPU_DATA.shift();
    if (MEM_DATA.length > MAX_PTS) MEM_DATA.shift();
    drawSparkline('cpu-chart', CPU_DATA, '#89b4fa');
    drawSparkline('mem-chart', MEM_DATA, '#cba6f7');

    const pill = document.getElementById('process-pill');
    pill.textContent = s.alive ? '● ALIVE' : '● DEAD';
    pill.className   = 'process-pill ' + (s.alive ? 'alive' : 'dead');

    const schedStatus = document.getElementById('sched-status');
    schedStatus.textContent = sch.active
      ? `Scheduler on — ${sch.fault} every ${sch.interval}s`
      : 'Scheduler off';

    const tbody = document.getElementById('history-body');
    tbody.innerHTML = [...h].reverse().slice(0, 50).map(r => `
      <tr>
        <td>${r.timestamp}</td>
        <td><span class="badge ${r.fault_type}">${r.fault_type}</span></td>
        <td><span class="badge ${r.outcome === 'terminated' ? 'err' : 'ok'}">${r.outcome}</span></td>
      </tr>`).join('');
  } catch(e) { /* server restarting */ }
}

// Load token from sessionStorage
const saved = sessionStorage.getItem('api_token');
if (saved) { document.getElementById('api-token').value = saved; saveToken(); }
document.getElementById('api-token').addEventListener('input', () => {
  sessionStorage.setItem('api_token', getToken());
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
